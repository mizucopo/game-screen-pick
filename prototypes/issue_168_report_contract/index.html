<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE — Game Screen Pick Report</title>
    <link rel="stylesheet" href="prototype.css" />
  </head>
  <body>
    <div class="prototype-ribbon">PROTOTYPE — productionではありません</div>
    <main id="app" aria-live="polite"></main>
    <nav class="prototype-switcher" aria-label="Prototype variant switcher">
      <button id="previous" type="button" aria-label="前のvariant">←</button>
      <span id="variant-label"></span>
      <button id="next" type="button" aria-label="次のvariant">→</button>
    </nav>
    <script src="prototype.js"></script>
  </body>
</html>
