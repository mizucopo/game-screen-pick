[package]
name = "game-screen-pick"
version = "2.0.1"
edition = "2024"
rust-version = "1.88"
description = "ゲーム録画からブログ用画像を選ぶCLI"
authors = ["みず <mizu.copo@gmail.com>"]
license = "MIT"
repository = "https://github.com/mizucopo/game-screen-pick"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
jsonschema = { version = "0.58", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3"
toml = "1.1"
tokio = { version = "1", features = ["rt", "time"] }
url = { version = "2", features = ["serde"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
png = "0.18"
