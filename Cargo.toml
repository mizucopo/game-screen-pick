[package]
name = "game-screen-pick"
version = "1.19.4"
edition = "2024"
rust-version = "1.88"
description = "ゲーム録画からブログ用画像を選ぶCLI"
authors = ["みず <mizu.copo@gmail.com>"]
license = "MIT"
repository = "https://github.com/mizucopo/game-screen-pick"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
url = "2"

[dev-dependencies]
png = "0.18"
