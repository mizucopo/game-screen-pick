name: Rust Quality Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run quality gate
        timeout-minutes: 15
        run: sh tests/check.sh

  distribution-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUST_RELEASE_TARGET: ${{ matrix.target }}
      PYTHON: python
    steps:
      - name: Set Rust artifact directory
        run: printf 'RUST_RELEASE_DIR=%s\n' "$RUNNER_TEMP/rust-release" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python for Rust packaging
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Rust build and license components
        run: |
          rustup show
          rustup target add "$RUST_RELEASE_TARGET"
          rustup component add rust-docs rust-src
      - name: Install Linux video and inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils pkg-config zlib1g-dev jq binutils
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          sh scripts/install-ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install macOS video and archive tools
        if: runner.os == 'macOS'
        run: |
          brew install gnu-tar jq
          sh scripts/install-ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install Windows video and inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-ci-windows-tools.ps1 -Prefix '${{ runner.temp }}/ffmpeg'
      - name: Check Windows process and distribution contracts first
        if: runner.os == 'Windows'
        run: |
          sh tests/distribution.sh
          cargo test --locked --test runtime_windows -- --nocapture
      - name: Run native quality gate on the distribution builder
        timeout-minutes: 30
        run: |
          # Preserve the primary assertion if a Windows test process aborts.
          if [ "$RUNNER_OS" = Windows ]; then export RUST_TEST_NOCAPTURE=1; fi
          sh tests/check.sh
      - name: Configure distribution runtime compatibility
        run: |
          case "$RUST_RELEASE_TARGET" in
            aarch64-apple-darwin) echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV" ;;
            *-pc-windows-msvc) echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV" ;;
          esac
      - name: Build archive with the common Rust distribution builder
        timeout-minutes: 40
        run: sh scripts/package-release.sh "$RUST_RELEASE_TARGET" "$RUST_RELEASE_DIR"
      - name: Run clean runtime smoke on the final archive
        timeout-minutes: 25
        run: |
          artifact_root="$RUST_RELEASE_DIR"
          if command -v cygpath > /dev/null 2>&1; then artifact_root=$(cygpath -u "$artifact_root"); fi
          target_root="$artifact_root/$RUST_RELEASE_TARGET"
          jq_options=(-er)
          if [ "$RUNNER_OS" = Windows ]; then jq_options=(--binary "${jq_options[@]}"); fi
          archive=$(jq "${jq_options[@]}" '.archive | select(type == "string" and length > 0)' "$target_root/manifest.json")
          sh scripts/build-distribution.sh "$RUST_RELEASE_TARGET" "$target_root/$archive"
      - name: Retain verified Rust distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('rust-release-{0}', matrix.target) }}
          path: ${{ runner.temp }}/rust-release/${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  distribution-verify:
    needs: distribution-build
    runs-on: ubuntu-22.04
    steps:
      - name: Set Rust artifact directory
        run: printf 'RUST_RELEASE_DIR=%s\n' "$RUNNER_TEMP/rust-release" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python for Rust packaging
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Download verified Rust distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/rust-release
      - name: Verify complete asset set and provenance
        run: |
          version="$(cargo metadata --locked --offline --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "game-screen-pick") | .version')"
          python -I scripts/distribution.py flatten "$RUST_RELEASE_DIR" dist "$version" "$(git rev-parse HEAD)"
