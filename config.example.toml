[run]
selection_method = "sampled_frames"
game_context_provider = "ollama"
game_context_model = "qwen3.8:27b"
# ollama_api_key = "your-ollama-api-key"
# openai_api_key = "your-openai-api-key"
# gemini_api_key = "your-gemini-api-key"
# xai_api_key = "your-xai-api-key"
primary_model = "qwen3.8:27b"
secondary_model = "muse-glimmer:30b"
ollama_timeout = 900.0
allow_cpu = false
ffmpeg_workers = 2
debug = false

# 動画理解を使う場合はselection_methodを"semantic_video"へ変更します。
# 動画・画像対応modelを提供する起動済みvLLMサーバーを指定してください。
# vllm_base_url = "http://127.0.0.1:8000/v1"
# vllm_model = "YOUR_SERVED_VIDEO_MODEL"
# vllm_api_key = "your-key" # 未指定時はVLLM_API_KEY
# vllm_timeout = 900.0
# vllm_cache_revision = "1" # 重みやサーバー設定を変更したら更新
# semantic_chunk_seconds = 30.0
# semantic_overlap_seconds = 2.0

# 以下は任意です。未設定のアンロード・起動停止操作は実行しません。
# trueの場合だけ、既存ollama_host（未指定時はOLLAMA_HOST）を使って全modelを解放。
# ollama_unload_before_vllm = false
# ollama_host = "http://127.0.0.1:11434"
# 起動/停止は両方指定。scriptは利用環境に用意し、制御操作後に終了させてください。
# {model} は上のvllm_modelに置換されます。
# vllm_start_command = ["/opt/game-screen-pick/start-vllm", "{model}"]
# vllm_stop_command = ["/opt/game-screen-pick/stop-vllm"]
# リモート操作は明示的にsshを指定し、vllm_base_url/ollama_hostも実際の接続先へ設定。
# remote POSIX shellへ渡すmodel引数は引用付きの{model_shell}を使います。
# vllm_start_command = ["ssh", "-o", "BatchMode=yes", "gpu-host", "/opt/game-screen-pick/start-vllm", "{model_shell}"]
# vllm_stop_command = ["ssh", "-o", "BatchMode=yes", "gpu-host", "/opt/game-screen-pick/stop-vllm"]
# vllm_command_timeout = 60.0
# vllm_startup_timeout = 900.0
# vllm_shutdown_timeout = 60.0
