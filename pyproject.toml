[project]
name = "game-screen-pick"
version = "1.5.2"
description = "ゲームスクリーンショットから品質・多様性を考慮して最適な画像を自動選択するAIツール"
authors = [
    {name = "みず", email = "mizu.copo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "faster-whisper>=1.2.1,<2.0.0",
    "huggingface-hub>=0.36.2,<1.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "nvidia-cublas-cu12>=12.8.4.1,<13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12>=12.8.90,<13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.10.2.21,<10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=2.3.1",
    "opencv-python>=4.11.0.86",
    "pillow>=12.1.0",
    "torch>=2.9.1,<2.11.0",
    "transformers>=4.57.0,<5.0.0",
]

[project.scripts]
game-screen-pick = "src.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "python-decouple-stubs>=0.1",
    "ruff>=0.14.10",
    "taskipy>=1.14.1",
    "types-jsonschema>=4.23.0.20240813",
    "types-requests>=2.32.4.20250913",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # 基本
    "I",             # import
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehension
    "ARG",           # unused args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "tests_ffmpeg"]
mypy_path = "src:stubs"

[tool.taskipy.tasks]
test = "ruff check --fix src tests tests_ffmpeg stubs && ruff format src tests tests_ffmpeg stubs && mypy && pytest"
test-ffmpeg = "pytest tests_ffmpeg"
acceptance-target = "python -m src.video_selection.acceptance.cli"
prototype-issue-170 = "python prototypes/issue_170_migration_acceptance/prototype.py"

[tool.uv]
package = true
