[project]
name = "game-screen-pick"
version = "1.12.0"
description = "ゲームスクリーンショットから品質・多様性を考慮して最適な画像を自動選択するAIツール"
authors = [
    {name = "みず", email = "mizu.copo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "numpy>=2.3.1",
    "opencv-python>=4.11.0.86",
    "pillow>=12.1.0",
    "torch>=2.12.1",
    "transformers>=5.5.0,<6.0.0",
]

[project.scripts]
game-screen-pick = "src.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "python-decouple-stubs>=3.8.0.4",
    "ruff>=0.16.2",
    "taskipy>=1.14.1",
    "types-requests>=2.33.0.20260712",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # 基本
    "I",             # import
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehension
    "ARG",           # unused args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src:stubs"

[tool.taskipy.tasks]
check = "ruff check src tests stubs && ruff format --check src tests stubs && mypy && pytest"
fix = "ruff check --fix src tests stubs && ruff format src tests stubs"
test = "task check"

[tool.uv]
package = true
